<svg xmlns="http://www.w3.org/2000/svg" width="600" height="488" viewBox="0 0 600 488" role="img" aria-labelledby="t d">
<title id="t">Timeline of the nine phases (and phase 9b)</title><desc id="d">Horizontal bars, one per phase, on a clock-time axis from 07:00 on 30 October to 10:00 on 31 October 2026 with the overnight gap removed. Phases 1 to 4 ran 07:51 to 18:11 on 30 October with 176, 50, 60 and 40 runs. Phase 5, 300 reviews, took about 6 minutes at 20:58. Phases 6 and 7 are two-developer runs, 30 each, 21:41 to 23:31. Phases 8, 9 and 9b ran 07:54 to 09:34 on 31 October with 30, 30 and 10 runs.</desc>
