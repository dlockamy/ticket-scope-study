<svg xmlns="http://www.w3.org/2000/svg" width="600" height="680" viewBox="0 0 600 680" role="img" aria-labelledby="t d">
<title id="t">Runs left unfinished, by ticket and repository layout</title><desc id="d">Grouped bar chart. For two changes, a rename (C2) and a policy change (C3), the number of runs out of 5 in which at least one app was not updated and live, for each of seven tickets, in a monorepo and in a multi-repo layout. Monorepo is 0 of 5 in every cell. Multi-repo is nonzero for three C3 tickets (partial list 4, decoy list 5, partial list with per-repo checks 5) and one C2 ticket (per-repo checks 2).</desc>
